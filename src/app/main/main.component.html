
<tecappsys-spinner></tecappsys-spinner>

  <tecappsys-sidebar [isDarkTheme]="isDarkTheme"></tecappsys-sidebar>
</div>

<div class="container-content">
  <div class="container custom-container">
    <div>
      <tecappsys-navbar (changeIsDarkTheme)="onChangeIsDarkTheme($event)" [isDarkTheme]="isDarkTheme"></tecappsys-navbar>
  
      <tecappsys-toolbar 
        [isSearch]="true" 
        (search)="onSearch($event)"
        (backView)="onBackView($event)"
      ></tecappsys-toolbar>
      
      <section class="section-router-outlet">
        <router-outlet></router-outlet> 
      </section> 
    </div>
     
  </div>
</div>
