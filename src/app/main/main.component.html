
<tecappsys-spinner></tecappsys-spinner>

<tecappsys-sidebar [isDarkTheme]="isDarkTheme"></tecappsys-sidebar>

<div class="tecappsys-main">
  <div class="main-container">
    <tecappsys-navbar 
      [isDarkTheme]="isDarkTheme"
      (changeIsDarkTheme)="onChangeIsDarkTheme($event)" 
    ></tecappsys-navbar>

    <tecappsys-toolbar 
        [isSearch]="true" 
        (search)="onSearch($event)"
        (backView)="onBackView($event)"
      ></tecappsys-toolbar>
    
    <router-outlet class="main-body"></router-outlet> 
  </div>
</div>
