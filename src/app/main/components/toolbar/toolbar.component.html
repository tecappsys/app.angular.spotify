<mat-sidenav-container>
    <div class="container">
        <div class="row g-0">
            <div class="col-4 col-md-4 col-sm-12">
                <app-toolbar-title [entity]="entity" [title]="title" [showBackView]="showBackView" (backView)="onBackView()"></app-toolbar-title>
            </div>
            <div class="col-lg-5 offset-lg-3 col-md-5 offset-md-3 col-sm-12">
                <app-toolbar-search (search)="onSearch($event)"></app-toolbar-search>
            </div>
        </div>
    </div>
</mat-sidenav-container>
